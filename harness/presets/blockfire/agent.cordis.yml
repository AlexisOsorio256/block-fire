# The `blockfire` agent preset — the single entry point for working on BLOCKFIRE.
#
# This file is the BLOCKFIRE harness layer. It is NOT part of DSH: it only names
# DSH's own plugin rows, plus one small capability router that lives beside it.
# Updating DSH therefore means updating packages, not rewriting this file.
#
# Design rules kept deliberately short (see ../../README.md):
#   1. The persona carries identity + contract, never volatile project facts.
#      HEAD, P0, current state, file lists live in the repo and are read on
#      demand — a stable prefix is what keeps KV-cache reuse high.
#   2. Context is progressive: a cheap skill catalog now, a skill body only when
#      the task matches it.
#   3. Heavy capability schemas (Blender MCP: 28 tools, ~7.4k tokens) are OFF by
#      default and activated per session through `bf_capability`.
#   4. Nothing here duplicates the project's own tooling: `tools/bf` stays the
#      single verification entry point and bash stays the general tool.
#
# Row rules that must not be broken (they are DSH mount invariants):
#   * A row that PUBLISHES a service needs an `isolate` realm inside a preset.
#   * A row that only CONSUMES a host service must stay OUTSIDE any realm.
#   * Host-plane services (tools, skills, jobs, goals, subagents, sandbox) are
#     never re-provided here.

# ── identity ────────────────────────────────────────────────────────────────

# Shadows the deployment persona for this preset only. `{{model}}` and `{{cwd}}`
# are the loop's own prompt variables. No volatile content: this text must stay
# byte-identical for the whole session.
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: |-
      Eres el agente de ingeniería de BLOCKFIRE sobre DeepSeek Harness. Directorio de trabajo: {{cwd}}.

      BLOCKFIRE es un FPS móvil en Godot 4.7.2 + GDScript (renderer Mobile, Android landscape-first). Linux es el laboratorio autónomo; el dispositivo Android físico es la autoridad de plataforma. La tarjeta operativa del proyecto (AGENTS.md) ya viene cargada abajo; la constitución es PROJECT_RULES.md. No cites de memoria hechos del proyecto: lee el archivo que los posee.

      CÓMO TRABAJAR — elige tu propio camino, esto no es un pipeline:
      - Parte del estado real, no de supuestos: `tools/bf doctor` es la sonda única (HEAD, Godot, Blender+MCP, teléfono, clips activos). `docs/ARCHITECTURE.md` posee dueños y contratos; `docs/CURRENT_STATE.md` posee el estado de hoy y el P0. Lee el código dueño antes de editarlo.
      - Usa la evidencia más barata que realmente pruebe el cambio. Prefiere el punto de entrada del proyecto (`tools/bf test`, `tools/bf qa <área>`, `tools/bf build android`) sobre comandos ad-hoc; bash sigue siendo tu herramienta general para todo lo demás.
      - No cargues contexto que no necesitas: el catálogo de skills es el mapa. Carga una skill cuando la tarea encaje con su descripción, no antes. Las capacidades pesadas están apagadas a propósito y se activan solo si la tarea las necesita.
      - Autonomía esperada: eliges archivos, herramientas, pruebas, orden e iteración. Pregunta al usuario solo por decisiones que le pertenecen.
      - Termina con evidencia, no con confianza. Lo que no ejecutaste se reporta como SIN VERIFICAR; lo deducido de logs o métricas, como INFERENCIA. Nunca afirmes una comprobación que no corriste.
      - Cada tarea declara su evidencia antes de darse por cerrada: código → tests; visual → captura o vídeo que miraste; Android → verificación en dispositivo; animación → fuente Blender + export + runtime; rendimiento → medición. No todas las tareas necesitan todas.
      - Delegar está disponible (`subagent`, `subagent_fork`) pero no es obligatorio: solo para trabajo realmente paralelo y grande. Conservas la propiedad del resultado.
      - commit + push están autorizados al cerrar una sesión cuyos cambios están verificados; no vuelvas a pedir permiso para eso. Operaciones destructivas, de sistema, o fuera del workspace sí requieren autorización explícita.
      - Si esta capa de harness desperdicia tokens, esconde una capacidad o fuerza un mal camino, arréglala en `harness/` (skill `blockfire-harness`). Nunca edites la instalación de DSH ni paquetes de terceros.

# The project's own AGENTS.md chain as one durable baseline message.
- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell ───────────────────────────────────────────────────────────────────
# Both consume the host shell registry and publish nothing, so they stay loose.
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ─────────────────────────────────────────────────────────
# Model-facing controls only; the job registry stays host-plane.
- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills (progressive disclosure) ─────────────────────────────────────────
# `customSkillDirs` resolves against this preset's own directory, so the skills
# travel with the preset and its catalog costs a few hundred tokens while a body
# costs nothing until the task matches it. The registry itself is host-plane.
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    customSkillDirs:
      - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/', baseUrl))"

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── goals ───────────────────────────────────────────────────────────────────
# Continuity across autonomous rounds; the goal service stays host-plane.
- id: command-goal
  name: '@deepseek-ai/dsh-command-goal'

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── plan mode ───────────────────────────────────────────────────────────────
# Plan state is per-agent, so an entry-local realm is its correct lifetime.
- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

# ── compaction ──────────────────────────────────────────────────────────────
# `compaction-basic` reads `toolResultPruner` via ctx.get, so the pruner shares
# this realm. `tokenMeter` stays host-plane (its projection units are
# process-wide) and is resolved from there.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation ──────────────────────────────────────────────────────────────
# The `subagents` registry and its spawn/fork backends are host-plane and are
# consumed from there — this group deliberately has NO realm. One main agent is
# the default; these rows only make delegation possible when work is genuinely
# parallel. `tool-workflow` and `tool-ralph` are intentionally absent: they cost
# schema tokens in every request for fan-out BLOCKFIRE rarely needs. Add them
# here (copy the rows from the shipped `standard` preset) if a task truly needs
# large parallel orchestration; the next session picks the change up.
- id: delegation
  name: cordis:group
  group: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        modelSelectionSettings: true
        backgroundMode: continuable

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

# ── remaining model-facing rows ─────────────────────────────────────────────
- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# The `web` service and its search provider stay host-plane.
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: true
    searchTimeoutMs: 60000

# ── capability router (the only BLOCKFIRE-owned code in this composition) ───
#
# Solves one measured problem: Blender MCP advertises 28 tools (~7.4k tokens of
# schema) of which BLOCKFIRE craft work uses a handful, and most sessions never
# touch Blender at all. The router registers ONE small tool and mounts the MCP
# bridge only when a task asks for it, into this preset's own scope.
- id: capabilities
  name: './plugins/capabilities.js'
  config:
    capabilities:
      blender:
        package: '@deepseek-ai/dsh-mcp-client'
        whenToUse: >-
          Blender GUI craft: animation clips, rigging, mesh and visual work on
          assets/animation_sources/*.blend while Blender is open. Requires the
          blender-mcp addon listening on 127.0.0.1:9876 (`tools/bf doctor`
          reports it).
        config:
          serverName: blender
          transport: stdio
          command: !!js process.env.BLOCKFIRE_BLENDER_MCP ?? (process.env.HOME + '/.local/share/blockfire-tools/blender-mcp-venv/bin/blender-mcp')
          args: []
          toolCallTimeoutMs: 120000
