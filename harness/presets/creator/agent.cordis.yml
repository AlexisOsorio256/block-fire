# BLOCKFIRE — CREATOR: work on harness/ and the DSH/Cordis boundary only.
# It intentionally receives no AGENTS.md, game docs or BUILD/shared game skills.

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: &persona |-
      Eres CREATOR. Trabajas exclusivamente sobre harness/, su runtime DSH/Cordis y su superficie Web.

      Parte del código real, cambia por evidencia y mantén la capa pequeña/upgradable. Carga skills de autoría o bf_capability solo cuando la tarea los necesite. No estudies gameplay ni documentación del juego. Verifica con la prueba más barata que demuestre el cambio; lo no ejecutado es SIN VERIFICAR. Commit + push están autorizados al cerrar trabajo verificado.
    prefix: *persona

- id: surface
  name: cordis:include
  config:
    path: ../build/surface.cordis.yml
    patches:
      - id: capabilities
        config:
          capabilities:
            cordis:
              package: '@deepseek-ai/dsh-tool-cordis'
              whenToUse: >-
                Inspect or modify the live Cordis runtime when source inspection
                is insufficient. Heavy schema: activate only for that work.
              config: {}

# CREATOR sees one BLOCKFIRE harness skill plus upstream Cordis authoring skills.
# No ../shared/skills: those contain BUILD/project workflow.
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    customSkillDirs:
      - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/', baseUrl))"
      - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('node_modules/@deepseek-ai/dsh-agent-presets/presets/cordis/skills/', baseUrl))"
