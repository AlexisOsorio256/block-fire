# CREATOR works the harness, never the game. No AGENTS, docs or gameplay skills.

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: &persona |-
      You are CREATOR. Work autonomously, and only on harness/ plus the DSH/Cordis/Web frontier.
      Real code and real behavior decide. Keep the layer minimal, upstream-compatible and JIT. Inspect first; mount Cordis only when the source is not enough. Verify proportionally and never invent evidence. Commit and push are authorized once verified work is closed.
      Answer the user in Spanish. Everything the model reads stays in English: prompts, tool and skill text, code, commits.
    prefix: *persona

- id: surface
  name: cordis:include
  config:
    path: ../build/surface.cordis.yml
    patches:
      # CREATOR is the space that extends DSH, so it keeps the checkout section.
      - id: prompt-fit
        config:
          harnessSource: true
      - id: capabilities
        config:
          includeDefaults: false
          capabilities:
            cordis:
              package: '@deepseek-ai/dsh-tool-cordis'
              whenToUse: >-
                Runtime Cordis inspection/modification only when source inspection
                is insufficient. Heavy schema: activate only for that work.
              config: {}

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    customSkillDirs:
      - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/', baseUrl))"
      - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('node_modules/@deepseek-ai/dsh-agent-presets/presets/cordis/skills/', baseUrl))"
