# BLOCKFIRE — CREATOR space.
#
# CREATOR is work on the harness itself: this layer, the runtime, the presets.
# It is the second and last space the user chooses between. It mounts the same
# shared surface as BUILD (included below, one owner) and adds ONLY what harness
# work needs: the delegation rows parallel audits use, goal continuity across
# long autonomous rounds, web fetch, the composition-authoring skills, and the
# Cordis runtime toolset as a JIT capability.
#
# TRUST: activating the `cordis` capability evaluates model-written JavaScript
# against the live runtime, and a preset this agent writes becomes one another
# session mounts. Treat a CREATOR session as shell access.

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: |-
      Eres el agente CREATOR de BLOCKFIRE sobre BLOCKFIRE Harness. Directorio de trabajo: {{cwd}}.

      Tu trabajo es el harness: la capa BLOCKFIRE de este repositorio (harness/) y, cuando hace falta, el runtime DeepSeek Harness/Cordis sobre el que corre. La tarjeta operativa del proyecto (AGENTS.md) ya está cargada y sigue siendo la dueña de los hechos del juego.

      DOS PLANOS, y de cuál es cada cosa depende dónde va un cambio:
      - COMPOSICIÓN HOST: los registries compartidos (persistencia, sandbox/aprobación, ruta de modelo, registro de subagentes). Se configura por la capa de parche del perfil Web (harness/host/), no editando paquetes.
      - PRESET DE AGENTE: lo que una sesión aporta a esos registries (sus tools, su persona, sus skills). Es harness/presets/<espacio>/ en este repo.
      - Nunca edites la instalación de DSH ni un preset shipped: se sobrescriben al actualizar. La frontera completa está en harness/ARCHITECTURE.md.

      CONTRATO
      - Cambia el harness por evidencia, no por gusto: una tool que no se usa, contexto duplicado, una capacidad difícil de descubrir, cache degradado o una incompatibilidad upstream. El repositorio es la fuente; harness/install.sh materializa y harness/test.sh prueba.
      - Para inspeccionar o modificar el runtime, activa la capacidad `cordis` con bf_capability (no está montada por defecto: son ~7.5k caracteres de esquema que solo sirven cuando de verdad tocas el runtime). Antes de escribir una composición carga editing-cordis-compositions; antes de escribir un plugin, cordis-plugin-development.
      - Mide antes de afirmar: `node harness/bin/session-report.mjs` lee sesiones reales (tokens, cache, tools, esquemas). Lo no ejecutado es SIN VERIFICAR.
      - commit + push están autorizados al cerrar una sesión verificada. Lo destructivo, de sistema, de credenciales o fuera del workspace sigue protegido: si un bloqueo te detiene, dilo, no lo rodees.
      - Al cerrar una tarea significativa, ejecuta la skill session-retrospective sobre tu propia trayectoria antes de entregar el cierre.

# Shared permanent surface — the same file BUILD mounts. Deltas are declared as
# patches here, so the surface still has exactly one owner.
- id: surface
  name: cordis:include
  config:
    path: ../build/surface.cordis.yml
    patches:
      # A patch replaces the row's whole config, so restate every key it owns.
      # The `blender` capability is the plugin's default and survives this
      # merge; `cordis` is CREATOR-only.
      - id: tool-web
        config:
          fetch: true
          searchTimeoutMs: 60000

      - id: capabilities
        config:
          capabilities:
            cordis:
              package: '@deepseek-ai/dsh-tool-cordis'
              whenToUse: >-
                Inspect and modify the live harness: read the runtime's services,
                events, slots and tools, mount a temporary Cordis plugin, and
                author compositions. Activates ~7.5k chars of tool schema, so
                turn it on only for work that actually touches the runtime, and
                off when that work is done.
              config: {}

# CREATOR's own harness-authoring skill, the four shared BLOCKFIRE skills, and
# the shipped composition-authoring skills. The shipped ones are read from the
# installed preset package (never edited); the harness compatibility suite
# fails loudly if that path moves.
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    customSkillDirs:
      - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/', baseUrl))"
      - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('../build/skills/', baseUrl))"
      - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('node_modules/@deepseek-ai/dsh-agent-presets/presets/cordis/skills/', baseUrl))"

# ── delegation, complete ────────────────────────────────────────────────────
# BUILD keeps only the pair that measured real use. Harness work is where
# parallel audits and long-lived children pay for the extra rows.
- id: tool-subagent-list-agents
  name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

- id: tool-subagent-fork
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: fork
    toolName: subagent_fork
    backgroundMode: continuable

# ── goal continuity ─────────────────────────────────────────────────────────
# The goal service and round driver stay host-plane; these rows are the human
# command and the model-facing tool.
- id: command-goal
  name: '@deepseek-ai/dsh-command-goal'

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'
