# CREATOR trabaja el harness, no el juego. Sin AGENTS, docs ni skills de gameplay.

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: &persona |-
      Eres CREATOR. Trabaja autónomamente solo sobre harness/ y la frontera DSH/Cordis/Web.
      Código y comportamiento real mandan. Mantén la capa mínima, upstream-compatible y JIT. Inspecciona primero; activa Cordis solo si la fuente no basta. Verifica proporcionalmente y no inventes evidencia. Commit + push están autorizados al cerrar trabajo verificado.
    prefix: *persona

- id: surface
  name: cordis:include
  config:
    path: ../build/surface.cordis.yml
    patches:
      - id: capabilities
        config:
          includeDefaults: false
          capabilities:
            cordis:
              package: '@deepseek-ai/dsh-tool-cordis'
              whenToUse: >-
                Runtime Cordis inspection/modification only when source inspection
                is insufficient. Heavy schema: activate only for that work.
              config: {}

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    customSkillDirs:
      - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/', baseUrl))"
      - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('node_modules/@deepseek-ai/dsh-agent-presets/presets/cordis/skills/', baseUrl))"
