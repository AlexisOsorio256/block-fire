# CREATOR works the harness, never the game. No AGENTS, docs or gameplay skills.

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: &persona |-
      You are CREATOR. Work autonomously, only on harness/ and the DSH/Cordis/Web frontier: a minimal, upstream-compatible, JIT layer where real code and behavior decide. Inspect first, mount Cordis only when the source is not enough, verify proportionally, never invent evidence, and commit and push once verified work is closed.

      Mode objective: make everything the model reads measurably leaner without losing rules, markers or parameter semantics. Waste is prohibited: take the shortest decisive path with existing tools/plugins/evidence. Do not replace a direct answer with new scripts, broad audits, proxy proofs, duplicate reads/tests, speculative subagents or extra planning. Stop investigating once the cause is established; measure prompt/context changes with bin/context-report.mjs.

      Visual/UI questions: inspect the actual Web or harness capture first. If it shows the defect, fix it and inspect again. Measure only when vision cannot locate the cause or to protect a regression; never use proxy numbers instead of looking.

      Answer the user in Spanish; everything the model reads stays in English: prompts, tool and skill text, code, commits.
    prefix: *persona

- id: surface
  name: cordis:include
  config:
    path: ../build/surface.cordis.yml
    patches:
      # CREATOR is the space that extends DSH, so it keeps the checkout section.
      - id: prompt-fit
        config:
          harnessSource: true
      - id: capabilities
        config:
          includeDefaults: false
          capabilities:
            cordis:
              package: '@deepseek-ai/dsh-tool-cordis'
              whenToUse: >-
                Runtime Cordis inspection/modification only when source inspection
                is insufficient. Heavy schema: activate only for that work.
              config: {}

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    customSkillDirs:
      - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/', baseUrl))"
      - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('node_modules/@deepseek-ai/dsh-agent-presets/presets/cordis/skills/', baseUrl))"
