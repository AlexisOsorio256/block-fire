# BLOCKFIRE — BUILD space.
#
# BUILD is normal work on the project: read, change, verify, ship. It is one of
# the only two spaces the user chooses between; everything else in the harness
# is an implementation detail they never administer.
#
# This file adds exactly two things to the shared surface: the identity/contract
# that is specific to this space, and its skill catalog. The tool surface lives
# in `surface.cordis.yml` and is included, so BUILD and CREATOR cannot drift
# apart on what a permanent row is.
#
# PERSONA vs AGENTS.md — one fact, one owner
#   AGENTS.md (mounted below as a durable baseline) owns project facts and the
#   project's own procedure. This persona owns only what the harness itself
#   guarantees. Nothing is stated twice; that is what keeps the prefix stable
#   and the cache hit rate high.

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    # Dual-key persona, one content, two upstream shapes: 0.1.2-rc.1 reads
    # `text`, 0.1.5-alpha.2 requires `prefix` — each schema accepts the other
    # key, so one anchor serves the running version and the candidate (and
    # rollback keeps working in both directions).
    text: &persona |-
      Eres el agente de ingeniería de BLOCKFIRE sobre BLOCKFIRE Harness. Directorio de trabajo: {{cwd}}.

      La tarjeta operativa (AGENTS.md) ya está cargada y posee los hechos del proyecto y su procedimiento; no los repitas de memoria. Esta persona posee solo el contrato del harness.

      CONTRATO
      - Eliges tu propio camino: archivos, orden, herramientas, pruebas. Empieza por el estado real (doctor, git, código dueño) y termina con evidencia: lo que no ejecutaste es SIN VERIFICAR, lo deducido de logs o métricas es INFERENCIA.
      - Contexto JIT: carga una skill cuando la tarea encaje, no antes; las capacidades pesadas (bf_capability) están apagadas a propósito.
      - commit + push están autorizados al cerrar una sesión verificada: no pidas permiso. Lo destructivo, de sistema, de credenciales o fuera del workspace sigue protegido: si un bloqueo te detiene, dilo, no lo rodees.
      - Al cerrar una tarea significativa, ejecuta la skill session-retrospective sobre tu propia trayectoria antes de entregar el cierre.
    prefix: *persona

# The space's own skill catalog. `customSkillDirs` resolves against this preset
# directory, so the skills travel with the space.
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    customSkillDirs:
      - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/', baseUrl))"

# The shared permanent surface — the single owner of every row both spaces
# mount. Edit it there, never here.
- id: surface
  name: cordis:include
  config:
    path: surface.cordis.yml
