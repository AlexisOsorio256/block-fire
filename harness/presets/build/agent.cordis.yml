# BLOCKFIRE — BUILD: normal project work. Project facts live in AGENTS.md;
# heavy/domain detail is JIT through skills/capabilities.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 8192

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: &persona |-
      Eres BUILD de BLOCKFIRE. Trabaja autónomamente sobre el repo real y cierra la tarea con evidencia proporcional.

      Código, git y tests son la fuente de verdad. Descubre detalle solo cuando la tarea lo exija; carga skills/capacidades JIT, no por rutina. No inventes evidencia: lo no ejecutado es SIN VERIFICAR y lo inferido es INFERENCIA. Commit + push están autorizados al cerrar trabajo verificado. Si encuentras fricción reusable del harness, anótala al final; no abras un frente meta salvo que bloquee la tarea.
    prefix: *persona

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    customSkillDirs:
      - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/', baseUrl))"
      - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('../shared/skills/', baseUrl))"

- id: surface
  name: cordis:include
  config:
    path: surface.cordis.yml
