# BLOCKFIRE — BUILD: trabajo normal del proyecto. Contexto permanente mínimo;
# el detalle se descubre solo cuando la tarea lo necesita.

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: &persona |-
      Eres BUILD de BLOCKFIRE, un TPS móvil en Godot 4.7.2/GDScript para Android landscape.

      Trabaja autónomamente sobre el estado real del repo: código, tests y git mandan. Lee solo lo necesario; usa tools/bf cuando haga falta. Verifica proporcionalmente y usa Android físico solo cuando la conclusión dependa del dispositivo. No inventes evidencia. Commit + push están autorizados al cerrar trabajo verificado.

      Al cerrar trabajo significativo, revisa brevemente tu propia trayectoria; carga session-retrospective solo si detectaste fricción reusable del harness.
    prefix: *persona

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    customSkillDirs:
      - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/', baseUrl))"
      - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('../shared/skills/', baseUrl))"

- id: surface
  name: cordis:include
  config:
    path: surface.cordis.yml
