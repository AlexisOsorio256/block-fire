# Shared 18-tool base. Rare heavy capability schemas stay behind bf_capability.

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'
    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'
    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        # Old tool payloads are context, not an archive. Keep enough head/tail to
        # identify the result; reread a narrow range if the middle becomes relevant.
        thresholdChars: 4096
        headChars: 2048
        tailChars: 768

- id: delegation
  name: cordis:group
  group: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'
    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        modelSelectionSettings: true
        backgroundMode: continuable

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# Search is irreducible; known-URL fetch is already available through bash.
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000

# The permanent prefix is the product: this row fits the assembled prompt to a
# budget — terse English descriptions, no section that only restates one, and
# sandbox wording that agrees with the policy the session actually has.
# BUILD never extends DSH itself, so the checkout section is dropped here and
# restored by the CREATOR include.
- id: prompt-fit
  name: './plugins/prompt.js'
  config:
    harnessSource: false

# BUILD gets Blender defaults; CREATOR patches includeDefaults:false + cordis.
- id: capabilities
  name: './plugins/capabilities.js'
