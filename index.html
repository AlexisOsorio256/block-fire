<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0a0f1e">
<title>BLOCKFIRE — FPS Blocky</title>
<link rel="stylesheet" href="style.css">
<script type="importmap">
{
  "imports": {
    "three": "./src/lib/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
  <div id="game-container"></div>

  <!-- HUD mínimo -->
  <div id="hud">
    <div id="hud-top">
      <div id="score-chip">
        <span id="kills">0</span><label>KILLS</label>
        <span id="timer">05:00</span>
      </div>
    </div>
    <div id="killfeed"></div>
    <div id="crosshair"><i></i><i></i><i></i><i></i></div>
    <div id="hitmarker"><i></i><i></i><i></i><i></i></div>
    <div id="killbanner"><span class="kb-title">ELIMINADO</span><span class="kb-sub">+100</span></div>
    <div id="hitbanner">HEADSHOT</div>
    <div id="hud-bottom">
      <div id="health-block"><span id="health">100</span><label>HP</label></div>
      <div id="ammo-block"><span id="ammo">30/90</span><label id="weapon-name">RIFLE</label></div>
    </div>
  </div>

  <!-- Mobile controls -->
  <div id="mobile-controls">
    <button id="btn-fullscreen" aria-label="Pantalla completa">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
    <div id="joystick-zone">
      <div id="joystick-base"><div id="joystick-stick"></div></div>
    </div>
    <div id="look-zone"></div>
    <div id="action-buttons">
      <button id="btn-fire" class="action-btn" aria-label="Disparar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="7.5"/><circle cx="12" cy="12" r="2.6" fill="currentColor" stroke="none"/><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3"/></svg>
      </button>
      <button id="btn-aim" class="action-btn" aria-label="Apuntar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5.5"/><path d="M2 12h4M18 12h4M12 2v4M12 18v4"/></svg>
      </button>
      <button id="btn-jump" class="action-btn" aria-label="Saltar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V6"/><path d="M6 11l6-6 6 6"/></svg>
      </button>
      <button id="btn-reload" class="action-btn" aria-label="Recargar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 6.3"/><path d="M20 5v6h-6"/></svg>
      </button>
      <button id="btn-switch" class="action-btn" aria-label="Cambiar arma">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h13l-3-3M20 17H7l3 3"/></svg>
      </button>
    </div>
  </div>

  <!-- Lobby / Overlay -->
  <div id="overlay">
    <div id="title-block">
      <h1>BLOCK<span>FIRE</span></h1>
      <p class="tagline">FPS ARCADE · FFA · 8 JUGADORES</p>
      <button id="playBtn">JUGAR</button>
      <p class="hint" id="hint">PC: WASD + RATÓN · MÓVIL: JOYSTICK</p>
    </div>
    <div id="result-block" class="hidden">
      <h2 id="result-title">VICTORIA</h2>
      <p id="result-sub">20 kills</p>
      <div id="result-stats">
        <div><span id="finalKills">0</span><label>KILLS</label></div>
        <div><span id="finalDeaths">0</span><label>MUERTES</label></div>
        <div><span id="finalScore">0</span><label>K/D</label></div>
      </div>
      <button id="retryBtn">OTRA PARTIDA</button>
    </div>
  </div>

  <div id="debug" class="hidden"></div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
