<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#1a1f2e">
<title>ESCOMBROS — Destrucción que Construye</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="bg"></div>
  <canvas id="c"></canvas>

  <div id="hud">
    <div id="hud-top">
      <div id="score-wrap">
        <span id="score">0</span>
        <span id="score-label">ESCOMBROS</span>
      </div>
      <div id="hud-right">
        <div id="shots-wrap">
          <span id="shots">1</span>
          <span id="shots-label">TIRO</span>
        </div>
        <div id="best-wrap">
          <span id="best">0</span>
          <span id="best-label">BEST</span>
        </div>
      </div>
    </div>
    <div id="feedback-wrap"><span id="feedback"></span></div>
    <div id="stats-wrap"><span id="stats-line"></span></div>
  </div>

  <div id="overlay">
    <div id="title-block">
      <h1 id="title">ESCOMBROS</h1>
      <p id="subtitle">ARRASTRA PARA APUNTAR · SUELTA PARA LANZAR</p>
      <p id="hint">Destruye para construir.<br>Los restos <em>no desaparecen</em> — úsalos para el siguiente tiro.</p>
      <button id="playBtn">TOCA PARA EMPEZAR</button>
      <p id="bestLine">BEST <span id="bestVal">0</span></p>
      <p id="tap-hint">Un drag. Mucho que pensar.</p>
    </div>
    <div id="result-block" class="hidden">
      <h2 id="result-title">ESCOMBROS</h2>
      <p id="result-sub"></p>
      <div id="result-stats">
        <div><span id="finalScore">0</span><label>ESCOMBROS</label></div>
        <div><span id="finalShots">0</span><label>TIROS</label></div>
        <div><span id="finalBest">0</span><label>BEST</label></div>
      </div>
      <button id="retryBtn">OTRA VEZ</button>
      <p id="retry-hint">Los restos quedan — nueva partida limpia</p>
    </div>
  </div>

  <div id="aim-hint">◀ ARRASTRA DESDE LA HONDA ▶</div>
  <div id="debug" class="hidden"></div>

<script src="game.js?v=2"></script>
</body>
</html>
