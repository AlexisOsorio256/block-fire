<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0a0f1e">
<title>BLOCKFIRE — FPS Blocky</title>
<link rel="stylesheet" href="style.css">
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
  <div id="game-container"></div>

  <!-- HUD mínimo -->
  <div id="hud">
    <div id="hud-top">
      <div id="hud-left">
        <span id="health">100</span><label>HP</label>
        <span id="ammo">30/90</span><label>AMMO</label>
      </div>
      <div id="hud-center">
        <span id="timer">05:00</span>
        <span id="score">0 - 0</span>
      </div>
      <div id="hud-right">
        <span id="kills">0</span><label>KILLS</label>
        <span id="deaths">0</span><label>DEATHS</label>
      </div>
    </div>
    <div id="crosshair">+</div>
    <div id="hitmarker"></div>
    <div id="killfeed"></div>
  </div>

  <!-- Mobile controls -->
  <div id="mobile-controls">
    <div id="joystick-zone">
      <div id="joystick-base"><div id="joystick-stick"></div></div>
    </div>
    <div id="look-zone"></div>
    <div id="action-buttons">
      <button id="btn-fire" class="action-btn">●</button>
      <button id="btn-aim" class="action-btn">◎</button>
      <button id="btn-jump" class="action-btn">↑</button>
      <button id="btn-reload" class="action-btn">↻</button>
      <button id="btn-switch" class="action-btn">⇄</button>
    </div>
  </div>

  <!-- Overlay -->
  <div id="overlay">
    <div id="title-block">
      <h1>BLOCKFIRE</h1>
      <p>8 JUGADORES · FFA · 20 KILLS PARA GANAR</p>
      <button id="playBtn">ENTRAR A PARTIDA</button>
      <p id="hint">PC: WASD + Mouse + Click · Móvil: Joystick + Desliza + Botones</p>
    </div>
    <div id="result-block" class="hidden">
      <h2 id="result-title">VICTORIA</h2>
      <p id="result-sub">20 kills</p>
      <div id="result-stats">
        <div><span id="finalKills">0</span><label>KILLS</label></div>
        <div><span id="finalDeaths">0</span><label>DEATHS</label></div>
        <div><span id="finalScore">0</span><label>SCORE</label></div>
      </div>
      <button id="retryBtn">OTRA PARTIDA</button>
    </div>
  </div>

  <div id="debug" class="hidden"></div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
